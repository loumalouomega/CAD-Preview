name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (bundle + type-check)
        run: npm run build

      - name: Test (unit)
        run: npm test

      # The webview and the VS Code host API used to have ZERO automated
      # coverage — every webview feature was verified by a manual F5 session or
      # not at all. These two steps are that gap's automated half; see
      # `CLAUDE.md`'s "Webview and host-side test harnesses".

      - name: Cache VS Code for integration tests
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}

      # Both need a display server on Linux: the webview harness runs headless
      # Chromium (SwiftShader), and the integration harness launches a real
      # VS Code (Electron). Chromium is not preinstalled on the runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (webview, Playwright over the real viewer bundle)
        run: xvfb-run -a npm run test:webview

      # @vscode/test-electron resolves "stable" to an exact version (and, on a
      # cache miss, downloads the archive) via update.code.visualstudio.com —
      # a network call this job has no control over. A transient blip there
      # (ETIMEDOUT/ENETUNREACH) fails the whole job even though nothing here
      # is actually broken, so retry a few times with backoff before giving up.
      - name: Test (integration, real VS Code host)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          command: xvfb-run -a npm run test:integration

      - name: Package extension (.vsix)
        run: npm run package -- --out cad-preview.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: cad-preview-vsix
          path: cad-preview.vsix
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package extension (.vsix)
        run: npm run package -- --out cad-preview-${{ github.ref_name }}.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath cad-preview-${{ github.ref_name }}.vsix -p ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: cad-preview-${{ github.ref_name }}.vsix
