name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (bundle + type-check)
        run: npm run build

      - name: Cache VS Code test binaries
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}

      # VS Code integration tests need a display server on Linux.
      - name: Test
        run: xvfb-run -a npm test

      - name: Package extension (.vsix)
        run: npx --yes @vscode/vsce package --out cad-preview.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: cad-preview-vsix
          path: cad-preview.vsix
          if-no-files-found: error
