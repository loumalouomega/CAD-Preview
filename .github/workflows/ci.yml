name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (bundle + type-check)
        run: npm run build

      - name: Test (unit)
        run: npm test

      # NOTE: @vscode/test-electron integration tests are added in a later milestone;
      # they will need `xvfb-run` on Linux and a `.vscode-test` cache step here.

      - name: Package extension (.vsix)
        run: npm run package -- --out cad-preview.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: cad-preview-vsix
          path: cad-preview.vsix
          if-no-files-found: error
