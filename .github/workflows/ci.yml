name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pin the commit under test. `github.ref` on its own is a moving
          # target: v3.27.0's tag was force-moved to a later commit four
          # minutes after it was pushed, and this run's checkout then died
          # with "The ref 'refs/tags/v3.27.0' does not point to the expected
          # commit" before a single test ran. The same happens when master
          # moves on while the run sits in the queue. Pull requests keep the
          # default merge-ref checkout — `github.sha` is the PR's merge commit
          # and the merge ref already pins it.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (bundle + type-check)
        run: npm run build

      - name: Test (unit)
        run: npm test

      # The only dead-link check over doc/** lives in `npm run docs:build`
      # (VitePress), which otherwise runs solely in docs.yml on push to
      # master — a broken intra-doc link would reach master before anything
      # notices. Cheap enough to run here on every push/PR.
      - name: Docs build (dead-link check)
        run: npm run docs:build

      # The webview and the VS Code host API used to have ZERO automated
      # coverage — every webview feature was verified by a manual F5 session or
      # not at all. These two steps are that gap's automated half; see
      # `CLAUDE.md`'s "Webview and host-side test harnesses".

      - name: Cache VS Code for integration tests
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}

      # Both need a display server on Linux: the webview harness runs headless
      # Chromium (SwiftShader), and the integration harness launches a real
      # VS Code (Electron). Chromium is not preinstalled on the runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (webview, Playwright over the real viewer bundle)
        run: xvfb-run -a npm run test:webview

      # @vscode/test-electron resolves "stable" to an exact version (and, on a
      # cache miss, downloads the archive) via update.code.visualstudio.com —
      # a network call this job has no control over. A transient blip there
      # (ETIMEDOUT/ENETUNREACH) fails the whole job even though nothing here
      # is actually broken, so retry a few times with backoff before giving up.
      #
      # The timeout is a HANG guard, not a budget: the suite's legitimate
      # runtime is ~8 min (it opens a real VS Code, loads the real WASM
      # kernels and drives a real webview per case), and the host-side
      # verification increment added seven more cases to it. Ten minutes was
      # close enough to the real runtime that a slow runner would have had
      # its perfectly healthy suite killed and retried three times.
      - name: Test (integration, real VS Code host)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 20
          command: xvfb-run -a npm run test:integration

      - name: Package extension (.vsix)
        run: npm run package -- --out cad-preview.vsix

      # The packaged archive must contain every runtime file the kernel
      # loaders resolve (derived from .vscodeignore's carve-outs) and nothing
      # that must not ship — a clean npm ci says nothing about the .vsix.
      - name: Check packaged runtime files
        run: npm run compat:vsix -- cad-preview.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: cad-preview-vsix
          path: cad-preview.vsix
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    # A tag that was moved and re-pushed leaves two runs of the same tag.
    # Serialise them: two concurrent `vsce publish` calls would have the
    # second one fail with "version already exists".
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Same pin as the build job: the run packages exactly the commit it
          # was triggered for.
          ref: ${{ github.sha }}

      # A tag push is the release trigger, so the tag must not move while the
      # run is in flight. The artifact below is built from the checked-out
      # commit; if the tag now points somewhere else, publishing it would ship
      # the wrong bits under the release name. The move triggered a newer run,
      # which owns the release — this one stands down instead.
      - name: Check that the tag still points at this commit
        id: tag
        run: |
          if ! git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"; then
            echo "::warning::Tag ${GITHUB_REF_NAME} is gone from the remote; this run publishes nothing."
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected=$(git rev-parse HEAD)
          tagged=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          if [ "$tagged" != "$expected" ]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} points at ${tagged}, but this run was triggered for ${expected}. The tag moved after the run started; the newer run owns this release and this one publishes nothing."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.tag.outputs.moved != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.tag.outputs.moved != 'true'
        run: npm ci

      - name: Build
        if: steps.tag.outputs.moved != 'true'
        run: npm run build

      - name: Package extension (.vsix)
        if: steps.tag.outputs.moved != 'true'
        run: npm run package -- --out cad-preview-${{ github.ref_name }}.vsix

      - name: Check packaged runtime files
        if: steps.tag.outputs.moved != 'true'
        run: npm run compat:vsix -- cad-preview-${{ github.ref_name }}.vsix

      # marketplace.visualstudio.com is a network call this job has no control
      # over, and it does go down: v1.9.0's publish died on a plain HTTP 503
      # seconds after starting, with nothing here actually broken. Retry with
      # backoff before giving up, the same way the integration test above
      # handles update.code.visualstudio.com. The PAT goes through the
      # VSCE_PAT env var rather than `-p` on the command line so it never
      # appears in the child process's argv.
      - name: Publish to VS Code Marketplace
        if: steps.tag.outputs.moved != 'true'
        uses: nick-fields/retry@v4
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npx vsce publish --packagePath cad-preview-${{ github.ref_name }}.vsix

      # Deliberately NOT gated on the publish succeeding. The GitHub Release is
      # independent of the Marketplace, and when v1.9.0's publish hit that 503
      # the tag was left with no release and no .vsix attached even though the
      # package built fine. `!cancelled()` still lets the job report failure, so
      # a genuine publish problem stays visible.
      - name: Create GitHub Release
        if: ${{ !cancelled() && steps.tag.outputs.moved != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: cad-preview-${{ github.ref_name }}.vsix
