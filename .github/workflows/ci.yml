name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (bundle + type-check)
        run: npm run build

      - name: Test (unit)
        run: npm test

      # NOTE: @vscode/test-electron integration tests are added in a later milestone;
      # they will need `xvfb-run` on Linux and a `.vscode-test` cache step here.

      - name: Package extension (.vsix)
        run: npm run package -- --out cad-preview.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: cad-preview-vsix
          path: cad-preview.vsix
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package extension (.vsix)
        run: npm run package -- --out cad-preview-${{ github.ref_name }}.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath cad-preview-${{ github.ref_name }}.vsix -p ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: cad-preview-${{ github.ref_name }}.vsix
